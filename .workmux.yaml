# Worktree workflow for DistillSpeech.
#
# Session mode gives each worktree its own tmux session with the windows
# defined below (editor, agent, tests, shell) instead of one split window.
mode: session

# Create worktrees inside this repo rather than as sibling directories.
worktree_dir: .worktree

agent: pig

# Non-shared files every worktree needs. `.env` holds local secrets and is
# gitignored, so it is copied in. `.venv` is deliberately neither copied nor
# symlinked: `post_create` rebuilds it per worktree so a branch that changes
# dependencies stays isolated.
files:
  copy:
    - .env

# One tmux window per concern. The agent window is focused when the session
# opens; move `focus: true` to the editor window if you would rather start in
# nvim.
windows:
  - name: agent
    panes:
      - command: pig
        focus: true
  - name: editor
    panes:
      - command: nvim
  - name: tests
    panes:
      - command: just watch
  - name: shell

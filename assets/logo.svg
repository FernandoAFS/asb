<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="asb — pull the brakes on your agents">
  <defs>
    <radialGradient id="badge" cx="0.35" cy="0.28" r="0.9">
      <stop offset="0" stop-color="#1e2938"/>
      <stop offset="0.62" stop-color="#111823"/>
      <stop offset="1" stop-color="#080c12"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.5" stop-color="#fcb52b"/>
      <stop offset="1" stop-color="#ef8700"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- app-style badge -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#badge)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="114.5" fill="none" stroke="#2b3849" stroke-width="3"/>
  <rect x="26" y="26" width="460" height="460" rx="92" fill="none" stroke="#161f2b" stroke-width="2"/>

  <!-- the warning-lamp mark: broken outer ring, inner ring, wordmark -->
  <g filter="url(#glow)" fill="none" stroke="url(#amber)" stroke-linecap="round">
    <path d="M 149.9 104.4 A 185 185 0 0 0 149.9 407.6" stroke-width="40"/>
    <path d="M 362.1 104.4 A 185 185 0 0 1 362.1 407.6" stroke-width="40"/>
    <circle cx="256" cy="256" r="145" stroke-width="22"/>
  </g>

  <text x="254" y="294" text-anchor="middle"
        font-family="Liberation Sans, DejaVu Sans, Helvetica, Arial, sans-serif"
        font-weight="800" font-size="106" letter-spacing="2"
        fill="url(#amber)" filter="url(#glow)">ASB</text>
</svg>
